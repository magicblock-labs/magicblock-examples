[package]
name = "gasless-starter-magicsvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
anchor-lang = "=1.0.2"
ephemeral-rollups-sdk = { version = "0.16.2", features = ["spl"] }
magicsvm = "0.3.1"
test-utils = { path = "../../../test-utils/rust", features = ["anchor"] }
tip-jar = { path = "../programs/tip-jar", features = ["no-entrypoint"] }
solana-address = "~2.6.1"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-native-token = "3.0.0"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-transaction-error = "3"
