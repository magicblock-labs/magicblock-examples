[package]
name = "pinocchio-private-counter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
logging = []

[dependencies]
pinocchio = { version = "0.11", features = ["cpi", "copy"] }
pinocchio-log = { version = "0.5.1" }
pinocchio-system = { version = "0.6" }
solana-address = { version = "2.6", features = ["syscalls"] }
ephemeral-rollups-pinocchio = { version = "0.18.0" }
