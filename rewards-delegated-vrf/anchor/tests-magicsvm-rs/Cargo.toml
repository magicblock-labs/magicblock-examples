[package]
name = "rewards-delegated-vrf-magicsvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
anchor-lang = "=1.0.2"
anchor-spl = { version = "=1.0.2", features = ["metadata", "associated_token"] }
ephemeral-rollups-sdk = { version = "0.18.0", features = ["anchor"] }
magicsvm = "0.3.0"
rewards-delegated-vrf = { path = "../programs/rewards-delegated-vrf", features = ["no-entrypoint"] }
test-utils = { path = "../../../test-utils/rust", features = ["anchor"] }
solana-account = "4.3.1"
solana-clock = "3"
solana-instruction = { version = "~3.4.0", features = ["bincode"] }
solana-keypair = "3.1.2"
solana-native-token = "3.0.0"
solana-signer = "3.0.1"

